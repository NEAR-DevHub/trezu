name: Frontend Build

on:
  push:
    branches: [ main ]
    paths:
      - 'nt-fe/**'
      - '.github/workflows/frontend-build.yml'
      - 'justfile'
      - 'render.yaml'
      - '.env.example'
  pull_request:
    branches: [ main ]
    paths:
      - 'nt-fe/**'
      - '.github/workflows/frontend-build.yml'
      - 'justfile'
      - 'render.yaml'
      - '.env.example'
  workflow_dispatch:

# Cancel superseded runs when a PR gets a new push. Other events group per
# commit, so every push to main runs to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      working-directory: nt-fe
      run: bun install

    - name: Check formatting
      working-directory: nt-fe
      run: bun run format:check

    - name: Check i18n (parity + dead keys)
      working-directory: nt-fe
      run: bun run check:i18n

    - name: Run unit tests
      working-directory: nt-fe
      run: bun run test

    - name: Build
      working-directory: nt-fe
      run: bun run build
