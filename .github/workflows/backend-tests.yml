name: Backend Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'nt-be/**'
      - '.github/workflows/backend-tests.yml'
      - 'justfile'
      - 'render.yaml'
      - '.env.example'
  pull_request:
    branches: [ main ]
    paths:
      - 'nt-be/**'
      - '.github/workflows/backend-tests.yml'
      - 'justfile'
      - 'render.yaml'
      - '.env.example'
  workflow_dispatch:

# A new push to a PR supersedes the in-flight run.
concurrency:
  group: backend-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Full debuginfo roughly doubles target/ (and so the rust-cache upload,
  # download and unpack) and slows linking. Line tables keep file:line in
  # panics and backtraces.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # fmt + clippy run in parallel with the tests. Clippy's check build can't
  # reuse the test job's codegen artifacts anyway.
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    # Cache is saved only from main: PR caches can't be shared with other PRs,
    # and letting every PR write one evicted main's (10 GB repo limit).
    - name: Cache Rust build artifacts
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: nt-be
        save-if: ${{ github.ref == 'refs/heads/main' }}
        cache-on-failure: true

    - name: Check formatting
      working-directory: nt-be
      run: cargo fmt -- --check

    # Uses the checked-in .sqlx query metadata (no database in this job), which
    # also catches a stale .sqlx — the sandbox Docker build relies on it too.
    - name: Run clippy
      working-directory: nt-be
      env:
        SQLX_OFFLINE: "true"
      run: cargo clippy -- -D warnings

  test:
    runs-on: ubuntu-latest

    steps:
    # Runs in the background: deleting these takes over a minute, and nothing
    # needs the space until the build is well under way.
    - name: Free Disk Space
      run: |
        nohup sudo rm -rf \
          /usr/share/dotnet \
          /opt/ghc \
          /usr/local/share/boost \
          /usr/local/lib/android \
          /opt/hostedtoolcache/CodeQL \
          > /dev/null 2>&1 &

    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    # Cache is saved only from main (see the lint job).
    - name: Cache Rust build artifacts
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: nt-be
        save-if: ${{ github.ref == 'refs/heads/main' }}
        cache-on-failure: true

    - name: Start PostgreSQL with Docker Compose
      working-directory: nt-be
      run: |
        docker compose up -d postgres_test
        sleep 5

    - name: Create .env file
      working-directory: nt-be
      # Fork PRs get no secrets, so both keys are empty here. Two different
      # reasons that's fine:
      #  - FASTNEAR_API_KEY: FastNear's public endpoints (api.fastnear.com,
      #    transfers.main.fastnear.com) accept an *empty* bearer as anonymous
      #    (only an *invalid* key 401s), so the live-hitting integration tests
      #    still work keyless. The one authed-only check
      #    (parity_across_production_endpoints) is gated off via
      #    FASTNEAR_LIVE_TESTS below.
      #  - INTENTS_EXPLORER_API_KEY: the intents-explorer calls are replayed
      #    from the offline rpc_cache_proxy (keyed by request, not auth), but
      #    swap detection is skipped when the key is empty
      #    (env parsing `.filter(|s| !s.is_empty())`), so fall back to a dummy
      #    non-empty value to exercise that path against the fixtures.
      run: |
        cat > .env << EOF
        DATABASE_URL=postgres://treasury_test:test_password@localhost:5433/treasury_test_db
        PORT=3000
        FASTNEAR_API_KEY=${{ secrets.FASTNEAR_API_KEY }}
        INTENTS_EXPLORER_API_KEY=${{ secrets.INTENTS_EXPLORER_API_KEY || 'ci-fixture-key' }}
        JWT_SECRET=test-jwt-secret-for-ci-testing
        EOF

    - name: Cache sqlx-cli
      id: cache-sqlx
      uses: actions/cache@v4
      with:
        path: ~/.cargo/bin/sqlx
        key: ${{ runner.os }}-sqlx-0.8

    - name: Install sqlx-cli
      if: steps.cache-sqlx.outputs.cache-hit != 'true'
      run: cargo install sqlx-cli --no-default-features --features postgres

    - name: Run migrations
      working-directory: nt-be
      run: sqlx migrate run

    - name: Extract RPC cache fixtures
      working-directory: nt-be
      run: |
        zstd -d tests/fixtures/rpc_cache.tar.zst -o tests/fixtures/rpc_cache.tar
        tar -xf tests/fixtures/rpc_cache.tar -C tests/fixtures/
        echo "Extracted $(ls tests/fixtures/rpc_cache/*.json | wc -l) cached RPC responses"

    - name: Start RPC cache proxy
      working-directory: nt-be
      run: |
        cargo build --bin rpc_cache_proxy
        CACHE_DIR=tests/fixtures/rpc_cache PORT=18552 \
          cargo run --bin rpc_cache_proxy 2>/tmp/rpc_proxy.log &
        # Wait for proxy to be ready
        for i in $(seq 1 30); do
          if curl -s http://127.0.0.1:18552/near-rpc/ > /dev/null 2>&1; then
            echo "RPC cache proxy ready"
            break
          fi
          sleep 0.5
        done

    - name: Run unit tests
      working-directory: nt-be
      env:
        NEAR_RPC_URL: http://127.0.0.1:18552/near-rpc
        NEAR_ARCHIVAL_RPC_URL: http://127.0.0.1:18552/near-archival
        INTENTS_EXPLORER_API_URL: http://127.0.0.1:18552/intents-explorer/api/v0
        # `enabled` only when the real FastNear secret is present (internal
        # PRs / main). On fork PRs the secret is empty -> `disabled`, so the
        # live-endpoint parity canary skips instead of failing on a dummy key.
        FASTNEAR_LIVE_TESTS: ${{ secrets.FASTNEAR_API_KEY != '' && 'enabled' || 'disabled' }}
      run: cargo test --lib --bins

    - name: Build binary for integration tests
      working-directory: nt-be
      run: cargo build

    - name: Run integration tests
      working-directory: nt-be
      env:
        NEAR_RPC_URL: http://127.0.0.1:18552/near-rpc
        NEAR_ARCHIVAL_RPC_URL: http://127.0.0.1:18552/near-archival
        INTENTS_EXPLORER_API_URL: http://127.0.0.1:18552/intents-explorer/api/v0
        # `enabled` only when the real FastNear secret is present (internal
        # PRs / main). On fork PRs the secret is empty -> `disabled`, so the
        # live-endpoint parity canary skips instead of failing on a dummy key.
        FASTNEAR_LIVE_TESTS: ${{ secrets.FASTNEAR_API_KEY != '' && 'enabled' || 'disabled' }}
      # Only the tests/ targets: `--tests` would also re-run the lib and bin
      # unit tests, which the previous step already ran.
      run: cargo test --test '*'

    - name: Show RPC proxy logs
      if: always()
      run: cat /tmp/rpc_proxy.log 2>/dev/null || echo "No proxy logs"

    - name: Stop PostgreSQL
      if: always()
      working-directory: nt-be
      run: docker compose down
