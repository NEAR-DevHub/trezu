name: Move linked issues to QA on merge

on:
  pull_request:
    types:
      - closed

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  update-linked-issues:
    if: >-
      github.event.pull_request.merged == true &&
      (github.event.pull_request.base.ref == 'main' || github.event.pull_request.base.ref == 'nearcom_redesign')
    runs-on: ubuntu-latest
    steps:
      - name: Move referenced issues to QA In Progress and flag the other product as To Port
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const qaStatus = "QA In Progress";
            const toPortStatus = "To Port";
            // Cards already in one of these statuses on the other product are left alone.
            const keepStatuses = new Set([qaStatus, toPortStatus, "Done – Latest Release", "Done"]);

            // Each staging branch is tracked in its own org project.
            const projectByBranch = {
              main: 23, // ✨ Trezu
              nearcom_redesign: 24, // ✨ near.com Biz
            };
            const targetNumber = projectByBranch[pr.base.ref];
            const otherNumber = Object.values(projectByBranch).find((n) => n !== targetNumber);

            async function loadProject(number) {
              const { organization } = await github.graphql(`
                query($org: String!, $number: Int!) {
                  organization(login: $org) {
                    projectV2(number: $number) {
                      id
                      title
                      field(name: "Status") {
                        ... on ProjectV2SingleSelectField { id options { id name } }
                      }
                    }
                  }
                }
              `, { org: owner, number });
              const project = organization?.projectV2;
              if (!project?.field?.id) {
                throw new Error(`Project #${number} or its Status field not found`);
              }
              return project;
            }

            async function setStatus(project, itemId, statusName, issueNumber) {
              const option = project.field.options.find((o) => o.name === statusName);
              if (!option) {
                core.warning(`Project "${project.title}" has no "${statusName}" option`);
                return;
              }
              await github.graphql(`
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                  updateProjectV2ItemFieldValue(
                    input: {
                      projectId: $projectId
                      itemId: $itemId
                      fieldId: $fieldId
                      value: { singleSelectOptionId: $optionId }
                    }
                  ) {
                    projectV2Item { id }
                  }
                }
              `, {
                projectId: project.id,
                itemId,
                fieldId: project.field.id,
                optionId: option.id,
              });
              core.info(`Set issue #${issueNumber} to "${statusName}" in "${project.title}"`);
            }

            // Extract issue numbers from PR title + body
            const text = `${pr.title || ""}\n${pr.body || ""}`;
            const issueRefs = new Set();
            for (const match of text.matchAll(/(?:^|[\s(])#(\d+)\b/gm)) {
              issueRefs.add(Number(match[1]));
            }

            core.info(`PR #${pr.number} merged into ${pr.base.ref}`);
            core.info(`Found ${issueRefs.size} issue ref(s): ${[...issueRefs].join(", ") || "none"}`);
            if (issueRefs.size === 0) return;

            const targetProject = await loadProject(targetNumber);
            const otherProject = await loadProject(otherNumber);

            for (const issueNumber of issueRefs) {
              core.info(`Processing issue #${issueNumber}`);

              let issue;
              try {
                const issueData = await github.graphql(`
                  query($owner: String!, $repo: String!, $num: Int!) {
                    repository(owner: $owner, name: $repo) {
                      issue(number: $num) {
                        id
                        state
                        projectItems(first: 20) {
                          nodes {
                            id
                            project { id }
                            fieldValueByName(name: "Status") {
                              ... on ProjectV2ItemFieldSingleSelectValue { name }
                            }
                          }
                        }
                      }
                    }
                  }
                `, { owner, repo, num: issueNumber });
                issue = issueData.repository?.issue;
              } catch (error) {
                core.info(`#${issueNumber} is not an issue — skipping`);
                continue;
              }
              if (!issue) {
                core.warning(`Issue #${issueNumber} not found`);
                continue;
              }

              // If issue was auto-closed by merge, reopen it
              if (issue.state === "CLOSED") {
                core.info(`Reopening issue #${issueNumber} (was auto-closed)`);
                await github.graphql(`
                  mutation($id: ID!) {
                    reopenIssue(input: { issueId: $id }) {
                      issue { state }
                    }
                  }
                `, { id: issue.id });
              }

              const items = issue.projectItems?.nodes || [];
              const targetItem = items.find((item) => item.project.id === targetProject.id);
              const otherItem = items.find((item) => item.project.id === otherProject.id);

              if (targetItem) {
                await setStatus(targetProject, targetItem.id, qaStatus, issueNumber);
              } else {
                core.warning(`Issue #${issueNumber} is not in "${targetProject.title}"`);
              }

              if (!otherItem) continue;
              const otherStatus = otherItem.fieldValueByName?.name;
              if (keepStatuses.has(otherStatus)) {
                core.info(
                  `Issue #${issueNumber} is "${otherStatus}" in "${otherProject.title}" — leaving it`,
                );
                continue;
              }
              await setStatus(otherProject, otherItem.id, toPortStatus, issueNumber);
            }
