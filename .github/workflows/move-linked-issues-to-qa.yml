name: Move linked issues on merge

on:
  pull_request:
    types:
      - closed

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  update-linked-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Move referenced Trezu issues by creator
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            // ✨ Trezu (org project 23). Exact login match is intentional:
            // tickets opened by Olha (olskik12) go to UX Review; every other author goes to QA In Progress.
            const projectNumber = 23;
            const uxAuthor = "olskik12";
            const uxStatus = "UX Review";
            const qaStatus = "QA In Progress";

            const { organization } = await github.graphql(`
              query($org: String!, $number: Int!) {
                organization(login: $org) {
                  projectV2(number: $number) {
                    id
                    title
                    field(name: "Status") {
                      ... on ProjectV2SingleSelectField { id options { id name } }
                    }
                  }
                }
              }
            `, { org: owner, number: projectNumber });

            const project = organization?.projectV2;
            if (!project?.field?.id) {
              core.setFailed(`Project #${projectNumber} or its Status field was not found`);
              return;
            }

            async function setStatus(itemId, statusName, issueNumber) {
              const option = project.field.options.find((o) => o.name === statusName);
              if (!option) {
                core.warning(`Project "${project.title}" has no "${statusName}" option`);
                return;
              }
              await github.graphql(`
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                  updateProjectV2ItemFieldValue(
                    input: {
                      projectId: $projectId
                      itemId: $itemId
                      fieldId: $fieldId
                      value: { singleSelectOptionId: $optionId }
                    }
                  ) {
                    projectV2Item { id }
                  }
                }
              `, {
                projectId: project.id,
                itemId,
                fieldId: project.field.id,
                optionId: option.id,
              });
              core.info(`Set issue #${issueNumber} to "${statusName}" in "${project.title}"`);
            }

            const text = `${pr.title || ""}\n${pr.body || ""}`;
            const issueRefs = new Set();
            for (const match of text.matchAll(/(?:^|[\s(])#(\d+)\b/gm)) {
              issueRefs.add(Number(match[1]));
            }

            core.info(`Found ${issueRefs.size} issue ref(s): ${[...issueRefs].join(", ") || "none"}`);
            if (issueRefs.size === 0) return;

            for (const issueNumber of issueRefs) {
              core.info(`Processing issue #${issueNumber}`);

              let issue;
              try {
                const issueData = await github.graphql(`
                  query($owner: String!, $repo: String!, $num: Int!) {
                    repository(owner: $owner, name: $repo) {
                      issue(number: $num) {
                        id
                        state
                        author { login }
                        projectItems(first: 20) {
                          nodes {
                            id
                            project { id }
                          }
                        }
                      }
                    }
                  }
                `, { owner, repo, num: issueNumber });
                issue = issueData.repository?.issue;
              } catch (error) {
                const graphqlErrors = error?.errors;
                const onlyNotFound = Array.isArray(graphqlErrors)
                  && graphqlErrors.length > 0
                  && graphqlErrors.every((entry) => entry.type === "NOT_FOUND");
                if (!onlyNotFound) throw error;
                core.info(`#${issueNumber} is not an issue — skipping`);
                continue;
              }
              if (!issue) {
                core.warning(`Issue #${issueNumber} not found`);
                continue;
              }

              if (issue.state === "CLOSED") {
                core.info(`Reopening issue #${issueNumber} (was auto-closed)`);
                await github.graphql(`
                  mutation($id: ID!) {
                    reopenIssue(input: { issueId: $id }) {
                      issue { state }
                    }
                  }
                `, { id: issue.id });
              }

              const item = (issue.projectItems?.nodes || []).find(
                (node) => node.project.id === project.id,
              );
              if (!item) {
                core.warning(`Issue #${issueNumber} is not in "${project.title}"`);
                continue;
              }

              const author = issue.author?.login;
              const statusName = author === uxAuthor ? uxStatus : qaStatus;
              core.info(`Issue #${issueNumber} author is ${author || "unknown"}`);
              await setStatus(item.id, statusName, issueNumber);
            }
