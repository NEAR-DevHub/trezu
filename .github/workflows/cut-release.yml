name: Cut Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which product to release'
        required: true
        type: choice
        options:
          - main
          - nearcom
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      commit_sha:
        description: 'Optional commit SHA to release from (defaults to HEAD of the target branch)'
        required: false
        type: string

jobs:
  cut-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      # main: production follows release-* branches via render.yaml, issues tracked in org project 23 (trezu).
      # nearcom: production deploys nearcom_redesign_v1 directly, issues tracked in org project 24 (nearcom).
      RELEASE_BRANCH: ${{ inputs.target == 'nearcom' && 'nearcom_redesign_v1' || 'main' }}
      TAG_PREFIX: ${{ inputs.target == 'nearcom' && 'nearcom-release-' || 'release-' }}
      PROJECT_NUMBER: ${{ inputs.target == 'nearcom' && '24' || '23' }}
      RELEASE_FIELD_NAME: Release

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit_sha || env.RELEASE_BRANCH }}
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}

      - name: Capture release commit SHA
        id: release_commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compute next version and changelog
        id: version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          default_bump: ${{ inputs.bump }}
          tag_prefix: ${{ env.TAG_PREFIX }}
          commit_sha: ${{ steps.release_commit.outputs.sha }}
          dry_run: true

      - name: Require a previous release tag
        env:
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "::error::No previous ${TAG_PREFIX}* tag found. Push a baseline tag (e.g. ${TAG_PREFIX}0.0.0) on the last deployed commit of ${RELEASE_BRANCH} first, otherwise the whole git history would be treated as part of this release."
            exit 1
          fi

      - name: Update render.yaml production branches
        if: inputs.target == 'main'
        run: |
          BRANCH="${{ steps.version.outputs.new_tag }}"
          python3 - "$BRANCH" <<'EOF'
          import sys, re

          branch = sys.argv[1]
          with open("render.yaml") as f:
              content = f.read()

          def update_production_branches(text, new_branch):
              lines = text.splitlines(keepends=True)
              result = []
              i = 0
              while i < len(lines):
                  line = lines[i]
                  if re.match(r'  - type:', line):
                      block = [line]
                      j = i + 1
                      while j < len(lines) and not re.match(r'  - type:|^databases:', lines[j]):
                          block.append(lines[j])
                          j += 1
                      block_text = "".join(block)
                      if "domains:" in block_text:
                          block_text = re.sub(
                              r'(^\s+branch:\s+).+',
                              r'\g<1>' + new_branch,
                              block_text,
                              flags=re.MULTILINE,
                          )
                      result.append(block_text)
                      i = j
                  else:
                      result.append(line)
                      i += 1
              return "".join(result)

          updated = update_production_branches(content, branch)
          with open("render.yaml", "w") as f:
              f.write(updated)

          print(updated)
          EOF

      - name: Commit render.yaml update to release branch and open PR
        if: inputs.target == 'main'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          BRANCH: ${{ steps.version.outputs.new_tag }}
          VERSION: ${{ steps.version.outputs.new_version }}
          CHANGELOGS: ${{ steps.version.outputs.changelog }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH"; then
            echo "Error: branch $BRANCH already exists"
            exit 1
          fi
          git checkout -b "$BRANCH"
          git add render.yaml
          if git diff --cached --quiet; then
            echo "No changes to render.yaml — production branch already set correctly"
          else
            git commit -m "chore: point production deployment to $BRANCH"
          fi
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: point production deployment to $BRANCH" \
            --body "Automated PR to update render.yaml production branches to \`$BRANCH\`." \
            --base main \
            --head "$BRANCH"
          gh release create "$BRANCH" \
            --title "v${VERSION}" \
            --target "$BRANCH" \
            --notes "$CHANGELOGS"

      - name: Tag nearcom release
        if: inputs.target == 'nearcom'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.new_tag }}
          VERSION: ${{ steps.version.outputs.new_version }}
          CHANGELOGS: ${{ steps.version.outputs.changelog }}
          SHA: ${{ steps.release_commit.outputs.sha }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG"; then
            echo "Error: tag $TAG already exists"
            exit 1
          fi
          gh release create "$TAG" \
            --title "nearcom v${VERSION}" \
            --target "$SHA" \
            --notes "$CHANGELOGS"

      - name: Set release on linked issues in project
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const { execSync } = require("child_process");

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const version = "${{ steps.version.outputs.new_version }}";
            const newTag = "${{ steps.version.outputs.new_tag }}";
            const previousTag = "${{ steps.version.outputs.previous_tag }}";
            const releaseSha = "${{ steps.release_commit.outputs.sha }}";
            const projectNumber = Number(process.env.PROJECT_NUMBER);
            const fieldName = process.env.RELEASE_FIELD_NAME;
            const releaseValue = `v${version}`;

            function extractIssueRefs(text) {
              const refs = new Set();
              for (const match of (text || "").matchAll(/(?:^|[\s(])#(\d+)\b/gm)) {
                refs.add(Number(match[1]));
              }
              return refs;
            }

            // Collect PRs included in this release (merge commits AND squash commits).
            const prNumbers = new Set();
            const logRange = `refs/tags/${previousTag}..${releaseSha}`;
            let commitSubjects = "";
            try {
              commitSubjects = execSync(
                `git log ${logRange} --pretty=format:%s`,
                { encoding: "utf8" },
              );
            } catch (error) {
              core.warning(`git log failed for range ${logRange}: ${error.message}`);
            }
            for (const line of commitSubjects.split("\n")) {
              const mergeMatch = line.match(/Merge pull request #(\d+)/);
              if (mergeMatch) { prNumbers.add(Number(mergeMatch[1])); continue; }
              const squashMatch = line.match(/\(#(\d+)\)\s*$/);
              if (squashMatch) prNumbers.add(Number(squashMatch[1]));
            }
            core.info(`Found ${prNumbers.size} PR(s) in release range`);

            const issueRefs = new Set();
            for (const prNumber of prNumbers) {
              let pr;
              try {
                const resp = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: prNumber,
                });
                pr = resp.data;
              } catch (error) {
                if (error.status === 404) {
                  core.info(`#${prNumber} is not a PR — skipping`);
                  continue;
                }
                throw error;
              }
              const text = `${pr.title || ""}\n${pr.body || ""}`;
              for (const num of extractIssueRefs(text)) {
                issueRefs.add(num);
              }
            }
            core.info(
              `Found ${issueRefs.size} linked issue(s): ${[...issueRefs].join(", ") || "none"}`,
            );
            if (issueRefs.size === 0) return;

            const { organization } = await github.graphql(`
              query($org: String!, $number: Int!, $fieldName: String!) {
                organization(login: $org) {
                  projectV2(number: $number) {
                    id
                    title
                    field(name: $fieldName) {
                      ... on ProjectV2Field { id dataType }
                      ... on ProjectV2SingleSelectField {
                        id
                        dataType
                        options { id name color description }
                      }
                    }
                  }
                }
              }
            `, { org: owner, number: projectNumber, fieldName });

            const project = organization?.projectV2;
            if (!project) {
              core.setFailed(`Project #${projectNumber} not found in ${owner}`);
              return;
            }

            const optionDescription = `Shipped in ${newTag}`;
            let field = project.field;
            if (!field?.id) {
              const created = await github.graphql(`
                mutation($projectId: ID!, $name: String!, $option: String!, $description: String!) {
                  createProjectV2Field(input: {
                    projectId: $projectId
                    dataType: SINGLE_SELECT
                    name: $name
                    singleSelectOptions: [{ name: $option, color: BLUE, description: $description }]
                  }) {
                    projectV2Field {
                      ... on ProjectV2SingleSelectField { id dataType options { id name color description } }
                    }
                  }
                }
              `, {
                projectId: project.id,
                name: fieldName,
                option: releaseValue,
                description: optionDescription,
              });
              field = created.createProjectV2Field.projectV2Field;
              core.info(`Created single-select field "${fieldName}" in "${project.title}"`);
            }

            // Value passed to updateProjectV2ItemFieldValue for every issue.
            let fieldValue;
            if (field.dataType === "TEXT") {
              fieldValue = { text: releaseValue };
            } else if (field.dataType === "SINGLE_SELECT") {
              let option = field.options.find((o) => o.name === releaseValue);
              if (!option) {
                // updateProjectV2Field replaces the whole option list; existing options must be
                // sent back with their ids or values already set on issues are wiped.
                const singleSelectOptions = [
                  { name: releaseValue, color: "BLUE", description: optionDescription },
                  ...field.options.map(({ id, name, color, description }) => ({
                    id,
                    name,
                    color,
                    description: description || "",
                  })),
                ];
                const updated = await github.graphql(`
                  mutation($fieldId: ID!, $options: [ProjectV2SingleSelectFieldOptionInput!]) {
                    updateProjectV2Field(input: { fieldId: $fieldId, singleSelectOptions: $options }) {
                      projectV2Field {
                        ... on ProjectV2SingleSelectField { options { id name } }
                      }
                    }
                  }
                `, { fieldId: field.id, options: singleSelectOptions });
                const updatedOptions = updated.updateProjectV2Field.projectV2Field.options;
                const lostOptions = field.options.filter(
                  (o) => !updatedOptions.some((u) => u.id === o.id),
                );
                if (lostOptions.length > 0) {
                  core.setFailed(
                    `Option ids changed for ${lostOptions.map((o) => o.name).join(", ")} in "${project.title}" — check the ${fieldName} values`,
                  );
                  return;
                }
                option = updatedOptions.find((o) => o.name === releaseValue);
                core.info(`Added option "${releaseValue}" to "${fieldName}" in "${project.title}"`);
              }
              fieldValue = { singleSelectOptionId: option.id };
            } else {
              core.setFailed(
                `Field "${fieldName}" in "${project.title}" must be Text or Single select (found ${field.dataType})`,
              );
              return;
            }
            const fieldId = field.id;

            for (const issueNumber of issueRefs) {
              let issue;
              try {
                const data = await github.graphql(`
                  query($owner: String!, $repo: String!, $num: Int!) {
                    repository(owner: $owner, name: $repo) {
                      issue(number: $num) {
                        id
                        projectItems(first: 50) {
                          nodes { id project { id } }
                        }
                      }
                    }
                  }
                `, { owner, repo, num: issueNumber });
                issue = data.repository?.issue;
              } catch (error) {
                core.info(`#${issueNumber} is not an issue — skipping`);
                continue;
              }
              if (!issue) {
                core.warning(`Issue #${issueNumber} not found — skipping`);
                continue;
              }

              let itemId = (issue.projectItems?.nodes || []).find(
                (item) => item.project.id === project.id,
              )?.id;
              if (!itemId) {
                const added = await github.graphql(`
                  mutation($projectId: ID!, $contentId: ID!) {
                    addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                      item { id }
                    }
                  }
                `, { projectId: project.id, contentId: issue.id });
                itemId = added.addProjectV2ItemById.item.id;
                core.info(`Added issue #${issueNumber} to "${project.title}"`);
              }

              await github.graphql(`
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $value: ProjectV2FieldValue!) {
                  updateProjectV2ItemFieldValue(
                    input: {
                      projectId: $projectId
                      itemId: $itemId
                      fieldId: $fieldId
                      value: $value
                    }
                  ) {
                    projectV2Item { id }
                  }
                }
              `, { projectId: project.id, itemId, fieldId, value: fieldValue });
              core.info(`Set ${fieldName}="${releaseValue}" on issue #${issueNumber} in "${project.title}"`);
            }
